[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travidia"
version = "0.1.0"
description = "Local video transcription with optional speaker diarization, GPU-accelerated via WhisperX."
requires-python = ">=3.10,<3.14"
dependencies = [
    "whisperx>=3.8.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
travidia = "travidia.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/travidia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
